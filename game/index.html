<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Arena — a roguelite arena shooter</title>
<link rel="icon" href="data:,">
<meta name="description" content="Emberfall Arena: hold the arena through ten waves, level up, choose upgrades, and face the Ashen King. An original 2D canvas game.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07050d; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    background: #0a0714;
    cursor: crosshair;
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberfall Arena: move with WASD, aim with the mouse, hold click to fire. Survive ten waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
